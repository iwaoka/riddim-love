  <body>
    <a class="skip" href="#main">Skip to results</a>
    <header class="top" id="top">
      <a class="logo" href="/" aria-label="RIDDIM.LOVE home">
        <svg class="logo-heart" viewBox="2 3 20 18" aria-hidden="true" focusable="false"><path d="M12 21 4.9 14C3.4 12.5 2 10.8 2 8.5A5.5 5.5 0 0 1 7.5 3c1.8 0 3 .5 4.5 2 1.5-1.5 2.7-2 4.5-2A5.5 5.5 0 0 1 22 8.5c0 2.3-1.4 4-2.9 5.5Z" fill="currentColor"/></svg>
        <span class="logo-text">RIDDIM<span>.</span>LOVE</span>
      </a>
      <!-- Home only: the line above the search (the header logo is the link; the footer keeps "Built for selectors."). -->
      <div class="hero">
        <p class="hero-mark">Just find it<span>.</span></p>
        <p class="tagline">Discover REGGAE MUSIC in depth.</p>
      </div>
      <nav class="lists-nav" aria-label="Your lists">
        <a class="dig-nav" id="dig-nav" href="/dig" aria-label="Dig history"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span>Dig</span></a>
        <a class="want-nav" id="want-nav" href="/want" aria-label="Want list"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" focusable="false"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="want-label">Want</span><span class="want-n"></span></a>
      </nav>
      <!-- Phones, outside home: the search bar folds away behind this button -->
      <button type="button" class="search-toggle" id="search-toggle" aria-controls="search-form" aria-expanded="false" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <form class="search" id="search-form" role="search" action="/" method="get">
        <fieldset class="types" id="types">
          <legend class="sr-only">Search in</legend>
          <label><input type="radio" name="type" value="riddim" checked /><span>Riddim</span></label>
          <label><input type="radio" name="type" value="tune" /><span>Tune</span></label>
          <label><input type="radio" name="type" value="artist" /><span>Artist</span></label>
          <label><input type="radio" name="type" value="label" /><span>Label</span></label>
          <label><input type="radio" name="type" value="producer" /><span>Producer</span></label>
        </fieldset>
        <div class="search-box">
          <label class="sr-only" for="q" id="q-label">Search riddim names</label>
          <input id="q" name="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
            minlength="2" maxlength="100" placeholder="Riddim name, e.g. Sleng Teng" enterkeyhint="search" />
          <button type="submit">Search</button>
        </div>
        <p class="credit">Search data provided by <a href="https://riddim-id.com/" rel="noopener">Riddim-ID</a></p>
      </form>
      <p class="hint" id="hint">Pick what to search, type, press <kbd>Enter</kbd>. <kbd>/</kbd> jumps to search. Typos are OK.</p>
    </header>
    <main id="main" tabindex="-1"></main>
    <div class="sr-only" id="announce" aria-live="polite"></div>
    <footer class="foot">
      <div class="foot-inner">
        <p class="foot-left"><span class="foot-brand">RIDDIM.LOVE</span> <span>Built for selectors.</span></p>
