<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RIDDIM.LOVE — Riddim search for reggae &amp; dancehall selectors</title>
    <meta name="description" content="Search reggae and dancehall riddims, tunes, artists and labels. See every tune on a riddim with artist, label and year, then jump to YouTube or Discogs. Data provided by Riddim-ID." />
    <link rel="canonical" href="https://riddim.love/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f11" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RIDDIM.LOVE" />
    <meta property="og:url" content="https://riddim.love/" />
    <meta property="og:title" content="RIDDIM.LOVE — Riddim search for reggae &amp; dancehall selectors" />
    <meta property="og:description" content="Search riddims, tunes, artists and labels. Every tune on a riddim, with artist, label and year." />
    <meta property="og:image" content="https://riddim.love/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RIDDIM.LOVE — Riddim search built for selectors" />
    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RIDDIM.LOVE — Riddim search for reggae &amp; dancehall selectors" />
    <meta name="twitter:description" content="Search riddims, tunes, artists and labels. Every tune on a riddim, with artist, label and year." />
    <meta name="twitter:image" content="https://riddim.love/og.png" />

    <!-- Site name for search engines (matches the visible site) -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"RIDDIM.LOVE","url":"https://riddim.love/"}</script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to results</a>
    <header class="top" id="top">
      <a class="logo" href="/" aria-label="RIDDIM.LOVE home">RIDDIM<span>.</span>LOVE</a>
      <p class="tagline">Built for selectors.</p>
      <form class="search" id="search-form" role="search" action="/" method="get">
        <fieldset class="types" id="types">
          <legend class="sr-only">Search in</legend>
          <label><input type="radio" name="type" value="riddim" checked /><span>Riddim</span></label>
          <label><input type="radio" name="type" value="tune" /><span>Tune</span></label>
          <label><input type="radio" name="type" value="artist" /><span>Artist</span></label>
          <label><input type="radio" name="type" value="label" /><span>Label</span></label>
        </fieldset>
        <div class="search-box">
          <label class="sr-only" for="q" id="q-label">Search riddim names</label>
          <input id="q" name="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
            minlength="2" maxlength="100" placeholder="Riddim name, e.g. Sleng Teng" enterkeyhint="search" />
          <button type="submit">Search</button>
        </div>
      </form>
      <p class="hint" id="hint">Pick what to search, type, press <kbd>Enter</kbd>. <kbd>/</kbd> jumps to search. Typos are OK.</p>
    </header>
    <main id="main" tabindex="-1"></main>
    <div class="sr-only" id="announce" aria-live="polite"></div>
    <footer class="foot">
      <p><span class="foot-brand">RIDDIM.LOVE</span><span class="foot-sep" aria-hidden="true">·</span><span>Built for selectors.</span><span class="foot-sep" aria-hidden="true">·</span><span>Data provided by <a href="https://riddim-id.com/" rel="noopener">Riddim-ID</a>.</span></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
